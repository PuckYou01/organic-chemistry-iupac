<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>ถอดรหัสคาร์บอน (IUPAC Quest)</title>
<style>
:root{--bg:#f3f6f9;--card:#fff;--ink:#1c2733;--mut:#5b6b7b;--acc:#0b7a75;--acc2:#e8f6f4;--bad:#c0392b;--bad2:#fdecea;--ok:#1e8449;--ok2:#e9f7ef;--hl:#f59e0b;--line:#d6dee6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
h1{margin:4px 0 0;font-size:28px}h2{margin:.2em 0}
.hero{padding:8px 0 4px}.sub2{margin:2px 0;color:var(--mut)}.alpha{margin:6px 0;padding:4px 10px;border-radius:8px;background:#fff6dd;color:#7a5b00;font-size:13px;display:inline-block}
.practice{display:flex;gap:6px;align-items:center;margin:8px 0;font-size:14px}
.mod{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.mod.locked{opacity:.55}.mh{display:flex;flex-direction:column}.mh .sub,.sub{color:var(--mut);font-size:13px}.soon{margin:4px 0 0;color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;margin:10px 0;align-items:center}.row.wrap{flex-wrap:wrap}.row .btn{flex:1;min-width:0}.row.wrap .btn{flex:0 0 calc(25% - 6px);padding:10px 4px}
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;min-height:46px;cursor:pointer;touch-action:manipulation}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}.btn.ghost{background:transparent;border-color:transparent;color:var(--acc)}.btn.done{background:var(--acc2);border-color:var(--acc)}
.btn:active{transform:translateY(1px)}
.head{display:flex;align-items:center;gap:8px;margin:2px 0 6px}.head .ttl{flex:1;display:flex;flex-direction:column;min-width:0}.head .btn{padding:6px 8px;min-height:36px}
.stat{display:flex;flex-direction:column;align-items:flex-end;font-size:13px;min-width:64px}#cred{color:#d6336c;font-size:16px;letter-spacing:2px}
.bottle{font-weight:700;color:var(--acc);margin:2px 0}.ask{margin:2px 0 8px;font-size:15px}
.molbox{background:var(--card);border:1px solid var(--line);border-radius:14px;touch-action:none;user-select:none;-webkit-user-select:none}
svg.mol{display:block;width:100%;height:auto;touch-action:none}
.bond{stroke:#17212b;stroke-width:2.3;stroke-linecap:round}.bond.arom{stroke-width:1.8}
.alabel{font-size:15px;font-weight:600;fill:#17212b}.alabel.el-O{fill:#d62828}.alabel.el-N{fill:#2457c5}.alabel.el-Cl,.alabel.el-F{fill:#2a9d4a}.alabel.el-Br{fill:#8a4b1f}.alabel.el-I{fill:#7b3fa0}
.hlc{fill:transparent}.hlc.sel{fill:rgba(245,158,11,.38)}.hlc.good{fill:rgba(30,132,73,.38)}.hlc.chain{fill:rgba(245,158,11,.28)}
.hlc.hint{fill:rgba(37,87,197,.35);animation:pulse 1s infinite}@keyframes pulse{50%{fill:rgba(37,87,197,.1)}}
.hit{fill:transparent;cursor:pointer}.anum{fill:#c0392b;font-weight:700;font-size:14px}
.chosen{text-align:center;color:var(--mut);margin:6px 0}
.fb{margin:8px 0}.fb .ok,.fb .no,.panel{border-radius:12px;padding:10px 12px;margin:6px 0}.fb .ok{background:var(--ok2);border:1px solid #bfe5cc}.fb .no{background:var(--bad2);border:1px solid #f3c1bb}
.fb p{margin:.3em 0}.fb .name{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700}.fb .reader{font-size:14px;color:#334}.fb .bounce{color:var(--bad);font-weight:600}.fb .msg{color:var(--mut)}
.dirs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.dircard{display:flex;flex-direction:column;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;font:inherit;cursor:pointer;min-height:64px}.dircard.on{border-color:var(--acc);background:var(--acc2)}.dircard span{font-size:14px;color:var(--mut)}
.panel.end{background:var(--card);border:1px solid var(--line)}.bigstars{font-size:24px;margin:.2em 0}.reslist{padding-left:1.4em}.reslist .no{color:var(--bad)}.reslist .ok{color:var(--ok)}
.labeltext{margin:6px 0;padding:8px 12px;background:#fff;border:1px dashed var(--acc);border-radius:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;font-weight:700;word-break:break-all;min-height:44px}.labeltext.big{font-size:20px;text-align:center}
.lsec{margin:8px 0}.lsec .lt{font-size:13px;color:var(--mut);margin-bottom:4px}.lsec.edit{background:var(--acc2);border-radius:12px;padding:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{appearance:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;min-height:40px;font:inherit;font-size:14px;cursor:pointer;touch-action:manipulation}.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}.chip.grp{background:var(--acc2);border-color:var(--acc)}.chip.add,.chip.go{border-style:dashed}.chip:disabled{opacity:.4;cursor:not-allowed}.chip.num{min-width:40px;padding:8px 6px}.chips.cls .chip{border-radius:12px;text-align:left}.chips.culprit{margin:8px 0}
.readerbox{margin:8px 0}.rcap{font-size:14px;color:var(--mut);margin-bottom:4px}svg.mol.small{max-height:200px}.unlock{background:var(--ok2);border:1px solid #bfe5cc;border-radius:10px;padding:6px 10px;font-size:14px}.bhit{stroke:transparent;stroke-width:24;cursor:pointer}
.edbar{margin:8px 0}.edbar .chips{margin:6px 0}.edmsg{min-height:22px;font-size:14px;color:var(--bad)}.regbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0}.reg{margin:4px 0;padding-left:1.3em;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.tabs{display:flex;gap:6px;margin:8px 0}.tab{flex:1;appearance:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 6px;font:inherit;cursor:pointer;min-height:44px}.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.who{display:flex;align-items:center;gap:6px;justify-content:space-between;font-size:13px;color:var(--mut)}.fld{display:block;margin:8px 0}.fld span{display:block;font-size:13px;color:var(--mut)}.fld input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit}.note{font-size:13px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}.card.locked{opacity:.6}.cbody{margin-top:8px;font-size:15px}.cbody .t{border-collapse:collapse;width:100%;margin:6px 0}.cbody .t th,.cbody .t td{border:1px solid var(--line);padding:4px 6px;text-align:left;font-size:14px}.cbody .warn{background:var(--bad2);border-radius:8px;padding:6px 10px}.cbody .src{font-size:12px;color:var(--mut)}
.btn.block{display:block;width:100%;margin:6px 0;text-align:left}.banner{background:#fff6dd;color:#7a5b00;border-radius:10px;padding:8px 12px;font-size:14px}
.mysum{margin:6px 0;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:15px}.tries{font-size:13px;color:var(--mut)}.try{margin:2px 0}
.locsofar{margin:6px 0;font-size:14px;color:var(--ink)}button:disabled{opacity:.45;cursor:not-allowed}
footer{margin-top:20px;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<div id="app"></div>

/* กราฟโมเลกุล (อะตอมหนัก · ไฮโดรเจนโดยนัย) + อ่าน SMILES + เทียบโครงสร้าง (isomorphism)
   พันธะ: 1 เดี่ยว · 2 คู่ · 3 สาม · 1.5 แอโรแมติก */
function Mol() { this.el = []; this.chg = []; this.adj = []; this.xy = []; }
Mol.prototype.add = function (el, chg, x, y) {
  this.el.push(el); this.chg.push(chg || 0); this.adj.push([]); this.xy.push([x || 0, y || 0]);
  return this.el.length - 1;
};
Mol.prototype.bond = function (a, b, o) { this.adj[a].push({ to: b, o: o }); this.adj[b].push({ to: a, o: o }); };
Mol.prototype.size = function () { return this.el.length; };
Mol.prototype.bo = function (a, b) {
  for (var i = 0; i < this.adj[a].length; i++) if (this.adj[a][i].to === b) return this.adj[a][i].o;
  return 0;
};
Mol.prototype.nb = function (a) { return this.adj[a].map(function (e) { return e.to; }); };
Mol.prototype.deg = function (a) { return this.adj[a].length; };
var VALENCE = { C: 4, N: 3, O: 2, F: 1, Cl: 1, Br: 1, I: 1 };
/* จำนวน H โดยนัย (ติดลบ = เกินวาเลนซ์ → โครงสร้างผิด) */
Mol.prototype.hcount = function (a) {
  var v = VALENCE[this.el[a]], c = this.chg[a];
  if (this.el[a] === 'N' && c === 1) v = 4;
  if (this.el[a] === 'O' && c === -1) v = 1;
  var s = 0;
  this.adj[a].forEach(function (e) { s += e.o; });
  return Math.round(v - s);
};
Mol.prototype.valid = function () {
  for (var i = 0; i < this.el.length; i++) if (this.hcount(i) < 0) return false;
  return true;

      netEvent(S, b, true, { text: 'start:' + seq[0], errors: [] });

    } else {
      S.wrong = 1;
      fb.appendChild(h('div', { 'class': 'no' }, [h('b', { text: 'ทิศที่ล็อกยังไม่ใช่เลขต่ำสุด — ขวดนี้ถูกตีกลับ' }), h('p', { text: m2Explain(b) }),
        h('p', { 'class': 'bounce', text: 'ลูกค้าตีกลับฉลากขวดนี้' + (S.practice ? '' : ' — ความน่าเชื่อถือลดลง 1 ระดับ') + ' · ทิศที่ถูกแสดงบนโมเลกุลแล้ว · ฉลากที่ถูกคือ ' + b.name })]));

/* ==== 65_builder.js ==== */
/* ตัวประกอบฉลาก (Label Builder) — ผู้เล่นประกอบชื่อเองจากชิ้นส่วน ไม่มีชื่อสำเร็จรูปให้เลือก
   ชิ้นส่วน: หมู่แทนที่ (เลขตำแหน่ง + ชื่อหมู่) · โซ่หลัก (ราก meth–dodec / วง / เบนซีน) · คำลงท้าย (+เลขตำแหน่ง)
   ได้ชิ้นส่วนเป็นข้อมูลโครงสร้าง (pieces) → เครื่องอ่านแปลงเป็นโมเลกุลได้แน่นอน ไม่ต้องอ่านข้อความอิสระ */
var B_SUBS = ['methyl', 'ethyl', 'propyl', 'butyl', 'pentyl', 'hexyl', 'fluoro', 'chloro', 'bromo', 'iodo', 'methoxy', 'ethoxy', 'propoxy'];
var B_ENDINGS = ['ane', 'ene', 'yne', 'ol', 'al', 'one', 'oic acid', 'oate', 'amine', 'amide'];
var B_END_TYPE = { ol: 'alcohol', al: 'aldehyde', one: 'ketone', 'oic acid': 'carboxylic acid', oate: 'ester', amine: 'amine', amide: 'amide' };
var B_NEED_LOC = { ene: 1, yne: 1, ol: 1, one: 1, amine: 1 };

function LabelBuilder(host, opts) {
  opts = opts || {};
  var st = { benz: false, ring: false, n: null, groups: [], ending: null, eloc: null, ester: null, edit: null };
  var onChange = opts.onChange || function () {};
  var textEl = h('div', { 'class': 'labeltext', id: 'label-text', 'aria-live': 'polite' });
  var body = h('div', { 'class': 'lbody' });
  host.appendChild(textEl); host.appendChild(body);

  function maxLoc() { return st.benz ? 6 : (st.n || 12); }
  function toPieces() {
    var p = { kind: st.benz ? 'benzene' : st.ring ? 'ring' : 'chain', n: st.benz ? 6 : st.n, subs: [], unsat: null, fg: null };
    st.groups.forEach(function (g) { g.locs.slice().sort(function (a, b) { return a - b; }).forEach(function (l) { p.subs.push({ name: g.name, loc: l }); }); });
    if (!st.benz) {
      if (st.ending === 'ene' || st.ending === 'yne') p.unsat = { type: st.ending, loc: st.ring ? 1 : st.eloc };
      else if (B_END_TYPE[st.ending]) {
        var term = /^(al|oic acid|oate|amide)$/.test(st.ending);
        p.fg = { type: B_END_TYPE[st.ending], loc: term ? 1 : st.eloc };
        if (st.ending === 'oate') p.ester = st.ester;
      }
    }
    return p;
  }
  function complete() {
    if (st.benz) return true;
    if (!st.n || !st.ending) return false;
    if (B_NEED_LOC[st.ending] && !st.ring && !st.eloc) return false;
    if (st.ring && st.ending !== 'ane' && st.ending !== 'ene' && st.ending !== 'yne') return false;
    if (st.ending === 'oate' && !st.ester) return false;
    return true;
  }
  function partialText() {
    var p = toPieces();
    if (complete()) return pieceText(p);
    var pre = st.groups.map(function (g) { return g.locs.slice().sort(function (a, b) { return a - b; }).join(',') + '-' + (MULT[g.locs.length] || '') + g.name; }).join('-');
    return (pre ? pre : '…') + (st.n || st.benz ? (st.benz ? 'benzene' : (st.ring ? 'cyclo' : '') + STEM[st.n]) : '…') + (st.ending ? ('-' + st.ending) : '…');
  }
  function fire() { render(); onChange(complete() ? toPieces() : null, st); }

  function chip(label, on, cb, cls, dis) {
    var b = h('button', { 'class': 'chip' + (on ? ' on' : '') + (cls ? ' ' + cls : ''), type: 'button', text: label });
    if (dis) b.disabled = true; else b.addEventListener('click', cb);
    return b;
  }
  function section(title, kids, id) { return h('div', { 'class': 'lsec', id: id }, [h('div', { 'class': 'lt', text: title }), h('div', { 'class': 'chips' }, kids)]); }

  function render() {
    clear(textEl).appendChild(document.createTextNode(partialText()));
    clear(body);
    // 1) หมู่แทนที่
    var gk = st.groups.map(function (g, i) {
      return chip(g.locs.slice().sort(function (a, b) { return a - b; }).join(',') + '-' + (MULT[g.locs.length] || '') + g.name + ' ✕', true, function () { st.groups.splice(i, 1); fire(); }, 'grp');
    });
    gk.push(chip('+ หมู่แทนที่', false, function () { st.edit = { name: null, locs: [] }; render(); }, 'add'));
    body.appendChild(section('1 · หมู่แทนที่ (คำนำหน้า)', gk, 'sec-subs'));
    if (st.edit) {
      var ed = st.edit, panel = h('div', { 'class': 'lsec edit', id: 'sec-edit' }, [h('div', { 'class': 'lt', text: 'เลือกชื่อหมู่ แล้วแตะเลขตำแหน่งตามจำนวนหมู่ (หมู่ซ้ำตำแหน่งเดียวกันแตะเลขเดิมซ้ำ เช่น 3,3 แตะ 3 สองครั้ง)' })]);
      var nm = h('div', { 'class': 'chips' }, B_SUBS.map(function (s) { return chip(s, ed.name === s, function () { ed.name = s; render(); }); }));
      var lc = h('div', { 'class': 'chips' }, []);
      for (var i = 1; i <= maxLoc(); i++) (function (i) { lc.appendChild(chip(String(i), ed.locs.indexOf(i) >= 0, function () { if (ed.locs.length < 5) ed.locs.push(i); render(); }, 'num')); })(i);
      var sofar = h('div', { 'class': 'locsofar', id: 'locs-so-far', text: 'เลขที่เลือก: ' + (ed.locs.length ? ed.locs.slice().sort(function (a, b) { return a - b; }).join(', ') + ' (' + (MULT[ed.locs.length] || 'หมู่เดียว') + ')' : '—') });
      var clr = chip('ล้างเลข', false, function () { ed.locs = []; render(); }, 'clr', !ed.locs.length);
      var ok = chip('เพิ่มหมู่นี้', false, function () { st.groups.push({ name: ed.name, locs: ed.locs.slice() }); st.edit = null; fire(); }, 'go', !(ed.name && ed.locs.length));
      var cancel = chip('ยกเลิก', false, function () { st.edit = null; render(); });
      panel.appendChild(nm); panel.appendChild(lc); panel.appendChild(sofar); panel.appendChild(h('div', { 'class': 'chips' }, [clr, ok, cancel]));
      body.appendChild(panel);
    }
    // 2) โซ่หลัก
    var sk = [];
    sk.push(chip('วง (cyclo)', st.ring, function () { st.ring = !st.ring; st.benz = false; if (st.ring && (st.ending === 'ol' || st.ending === 'al')) st.ending = null; fire(); }, 'tog'));
    sk.push(chip('เบนซีน', st.benz, function () { st.benz = !st.benz; if (st.benz) { st.ring = false; st.n = null; st.ending = null; st.eloc = null; } fire(); }, 'tog'));
    if (!st.benz) for (var k = 1; k <= MAX_C; k++) (function (k) { sk.push(chip(STEM[k] + '- (' + k + ')', st.n === k, function () { st.n = k; if (st.eloc > k) st.eloc = null; st.groups.forEach(function (g) { g.locs = g.locs.filter(function (l) { return l <= k; }); }); st.groups = st.groups.filter(function (g) { return g.locs.length; }); fire(); }, 'stem')); })(k);
    body.appendChild(section('2 · โซ่หลัก (ราก)', sk, 'sec-stem'));
    // 3) คำลงท้าย
    if (!st.benz) {
      var ek = B_ENDINGS.map(function (e) {
        var dis = (opts.allowEnding && opts.allowEnding.indexOf(e) < 0 && e !== 'ane') || (st.ring && e !== 'ane' && e !== 'ene' && e !== 'yne');
        return chip('-' + e, st.ending === e, function () { st.ending = e; if (!B_NEED_LOC[e]) st.eloc = null; fire(); }, 'end', dis);
      });
      body.appendChild(section('3 · คำลงท้าย', ek, 'sec-end'));
      if (B_NEED_LOC[st.ending] && !st.ring) {
        var lk = []; for (var j = 1; j <= (st.n ? (st.ending === 'ene' || st.ending === 'yne' ? st.n - 1 : st.n) : 12); j++) (function (j) { lk.push(chip(String(j), st.eloc === j, function () { st.eloc = j; fire(); }, 'num')); })(j);
        body.appendChild(section('ตำแหน่งของ -' + st.ending, lk, 'sec-eloc'));
      }
      if (st.ending === 'oate') {
        body.appendChild(section('หมู่แอลคิล R′ ของเอสเทอร์ (คำแรก)', ['methyl', 'ethyl', 'propyl', 'phenyl'].map(function (r) { return chip(r, st.ester === r, function () { st.ester = r; fire(); }); }), 'sec-ester'));
      }
    }
  }
  render();
  return {
    getPieces: function () { return complete() ? toPieces() : null; },
    isComplete: complete,
    reset: function () { st = { benz: false, ring: false, n: null, groups: [], ending: null, eloc: null, ester: null, edit: null }; fire(); },
    setPieces: function (p) {
      var g = {}; (p.subs || []).forEach(function (s) { (g[s.name] = g[s.name] || []).push(s.loc); });
      st = { benz: p.kind === 'benzene', ring: p.kind === 'ring', n: p.kind === 'benzene' ? null : p.n, groups: Object.keys(g).map(function (k) { return { name: k, locs: g[k] }; }), ending: null, eloc: null, ester: p.ester || null, edit: null };
      if (!st.benz) {
        if (p.unsat) { st.ending = p.unsat.type; st.eloc = p.unsat.loc; }
        else if (p.fg) { st.ending = { alcohol: 'ol', aldehyde: 'al', ketone: 'one', 'carboxylic acid': 'oic acid', ester: 'oate', amine: 'amine', amide: 'amide' }[p.fg.type]; st.eloc = p.fg.loc; }
        else st.ending = 'ane';
      }
      fire();
    },
    state: function () { return st; }
  };
}

/* ==== 66_modules2.js ==== */
/* M3 Bond Forge · M4 Group Tower · M5 Error Hunt — ใช้ตัวประกอบฉลาก (65_builder.js) + ตัววินิจฉัย (56_diagnose.js)
   ผลป้อนกลับมาจาก "เครื่องอ่านฉลาก": วาดโครงสร้างจากชื่อที่ผู้เล่นประกอบ เทียบกับขวดจริง */
function netEvent(S, b, ok, extra) {       // ส่งข้อมูลเชิงคุณภาพ (80_net.js) — ไม่มีไฟล์/ไม่ได้ตั้งค่า = ข้าม
  try { if (typeof Net !== 'undefined' && Net.event) Net.event(S, b, ok, extra || {}); } catch (e) { /* ไม่ให้การส่งข้อมูลทำเกมพัง */ }

function readerView(box, mol, caption) {

function bounceNote(S, b) {

/* ---- ขั้นประกอบฉลากร่วม ---- */
function labelStage(S, b, area, o) {
  var svg = svgEl('svg', { 'class': 'mol', id: 'mol', role: 'img', 'aria-label': 'โครงสร้างของสารในขวด' });
  var host = h('div', { 'class': 'builder', id: 'builder' });
  var LB = LabelBuilder(host, { allowEnding: o.allowEnding });
  var rbox = h('div', { 'class': 'readerbox', id: o.rboxId || 'readerbox' });
  var fb = h('div', { 'class': 'fb', id: o.fbId || 'fb', 'aria-live': 'polite' });
  var bReset = h('button', { 'class': 'btn', id: 'btn-reset-label', text: 'ล้างฉลาก' });
  var bSubmit = h('button', { 'class': 'btn primary', id: 'btn-submit', text: 'ส่งฉลาก' });
  if (o.showMol !== false) area.appendChild(h('div', { 'class': 'molbox' }, [svg]));
  area.appendChild(host); area.appendChild(h('div', { 'class': 'row' }, [bReset, bSubmit])); area.appendChild(rbox); area.appendChild(fb);
  if (o.showMol !== false) drawMol(svg, b.mol, { w: 360, h: 230, onAtom: false });
  if (o.initial) LB.setPieces(o.initial);
  window.__LB = LB;
  bReset.addEventListener('click', function () { if (!S.locked) { LB.reset(); if (o.initial) LB.setPieces(o.initial); clear(fb); clear(rbox); } });
  bSubmit.addEventListener('click', function () {
    if (S.locked) return;
    var p = LB.getPieces(); clear(fb);
    if (!p) { fb.appendChild(h('p', { 'class': 'msg', text: 'ประกอบฉลากให้ครบก่อน: โซ่หลัก + คำลงท้าย (และเลขตำแหน่งที่จำเป็น)' })); return; }
    var d = diagnoseLabel(b.canon, p), text = pieceText(p);
    if (o.custom) { o.custom(d, p, text, fb, rbox); return; }
    if (d.kind === 'ok') {
      S.locked = true; var pts = bottlePoints(S);
      fb.appendChild(h('div', { 'class': 'ok' }, [h('b', { text: 'ถูกต้อง +' + pts + ' แต้ม' }), h('p', { 'class': 'name', text: 'ฉลาก: ' + text }), o.okNote ? h('p', { text: o.okNote }) : null]));
      netEvent(S, b, true, { text: text, errors: [] });
      finishBottle(S, true, function () { updateStat(S); });
      fb.appendChild(nextBtn(S, o.runFn));
      return;
    }
    S.wrong += 1;
    readerView(rbox, d.mol, 'เครื่องอ่านฉลากวาดจากชื่อ "' + text + '":');
    fb.appendChild(h('div', { 'class': 'no' }, [h('b', { text: 'ฉลากยังไม่ถูก −2 แต้ม' }), h('p', { text: explainDiag(d, b.canon) })]));
    netEvent(S, b, false, { text: text, errors: d.errors });
    if (S.wrong >= MAX_WRONG) {
      S.locked = true; fb.appendChild(bounceNote(S, b));
      finishBottle(S, false, function () { updateStat(S); });
      fb.appendChild(nextBtn(S, o.runFn));
    }
  });
  return { LB: LB };
}

/* ======================= M3 Bond Forge ======================= */
function renderM3(S) {
  var b = S.bottles[S.i], root = clear(App.root), place = S.i % 2 === 0;
  window.__S = S; S.mode = place ? 'place' : 'name';
  root.appendChild(shiftHead(S, 'M3 Bond Forge'));
  root.appendChild(bottleTitle(S));
  if (!place) {
    root.appendChild(h('p', { 'class': 'ask', text: 'อ่านโครงสร้างในขวด แล้วประกอบฉลาก: บอกตำแหน่งของพันธะคู่/พันธะสามด้วย' }));
    labelStage(S, b, root, { runFn: renderM3, okNote: 'ตำแหน่งพันธะต้องได้เลขน้อยที่สุดก่อนหมู่แทนที่ (ตำรา น.28)' });
    return;
  }
  // วางพันธะให้ตรงชื่อ
  var skel = molFromEntry(b.entry), orders = {};
  skel.adj.forEach(function (l) { l.forEach(function (e) { if (skel.el[e.to] === 'C' && (e.o === 2 || e.o === 3)) e.o = 1; }); });
  root.appendChild(h('p', { 'class': 'ask', text: 'ฉลากบอกว่า: ' }));
  root.appendChild(h('div', { 'class': 'labeltext big', id: 'target-name', text: b.name }));
  root.appendChild(h('p', { 'class': 'ask', text: 'แตะพันธะ C–C เพื่อเปลี่ยนเป็นพันธะคู่ / พันธะสาม (แตะซ้ำเพื่อวนกลับ) ให้ตรงกับฉลาก แล้วกดตรวจ' }));
  var svg = svgEl('svg', { 'class': 'mol', id: 'mol', role: 'img', 'aria-label': 'โครงสร้างที่ต้องวางพันธะ' });
  var fb = h('div', { 'class': 'fb', id: 'fb', 'aria-live': 'polite' });
  var bSubmit = h('button', { 'class': 'btn primary', id: 'btn-submit', text: 'ตรวจโครงสร้าง' });
  root.appendChild(h('div', { 'class': 'molbox' }, [svg])); root.appendChild(h('div', { 'class': 'row' }, [bSubmit])); root.appendChild(fb);
  S.orders = orders;
  function redraw() {
    skel.adj.forEach(function (l, a) { l.forEach(function (e) { if (skel.el[a] === 'C' && skel.el[e.to] === 'C') { var k = Math.min(a, e.to) + '-' + Math.max(a, e.to); e.o = orders[k] || 1; } }); });
    drawMol(svg, skel, { w: 360, h: 230, bondHits: true, onAtom: false });
  }
  redraw();
  svg.addEventListener('click', function (e) {
    if (S.locked) return;
    var t = e.target; if (!(t.classList && t.classList.contains('bhit'))) return;
    var k = t.getAttribute('data-a') + '-' + t.getAttribute('data-b'), cur = orders[k] || 1;
    var nx = cur >= 3 ? 1 : cur + 1; if (nx === 1) delete orders[k]; else orders[k] = nx;
    redraw();
  });
  bSubmit.addEventListener('click', function () {
    if (S.locked) return; clear(fb);
    var r = m3Check(b, orders);
    if (r.ok) {
      S.locked = true; var pts = bottlePoints(S);
      fb.appendChild(h('div', { 'class': 'ok' }, [h('b', { text: 'ถูกต้อง +' + pts + ' แต้ม' }), h('p', { text: 'ตำแหน่งพันธะอ่านจากเลขหน้าคำลงท้าย -ene / -yne (ตำรา น.28)' })]));
      netEvent(S, b, true, { text: b.name, errors: [], mode: 'place' });
      finishBottle(S, true, function () { updateStat(S); });
      fb.appendChild(nextBtn(S, renderM3)); return;
    }
    S.wrong += 1;
    var why = 'โครงสร้างที่วางไว้ไม่ตรงกับฉลาก';
    if (r.reason === 'valence') why = 'วางพันธะแล้วคาร์บอนบางตัวมีพันธะเกิน 4 ไม่ได้';
    else if (!Object.keys(orders).length) why = 'ยังไม่ได้วางพันธะคู่/สามเลย — ฉลากนี้ลงท้าย -ene/-yne';
    else { try { var nm = nameMol(r.mol).name; why = 'โครงสร้างที่คุณวางมีชื่อว่า "' + nm + '" แต่ฉลากคือ "' + b.name + '" — ดูตำแหน่งและชนิดของพันธะอีกครั้ง'; } catch (x) { /* เกินขอบเขต */ } }
    fb.appendChild(h('div', { 'class': 'no' }, [h('b', { text: 'ยังไม่ตรง −2 แต้ม' }), h('p', { text: why })]));
    netEvent(S, b, false, { text: Object.keys(orders).join(','), errors: ['locant'], mode: 'place' });
    if (S.wrong >= MAX_WRONG) {
      S.locked = true; b.multi.forEach(function (x) { orders[Math.min(x[0], x[1]) + '-' + Math.max(x[0], x[1])] = x[2]; }); redraw();
      fb.appendChild(bounceNote(S, b)); finishBottle(S, false, function () { updateStat(S); }); fb.appendChild(nextBtn(S, renderM3));
    }
  });

function m6Hint(canon) {

  });
}

/* ==== 70_progress.js ==== */
/* ความก้าวหน้าของผู้เล่น — localStorage (อาจใช้ไม่ได้ใน LINE/โหมดส่วนตัว → ทำงานได้โดยไม่มี และไม่เก็บข้อมูลส่วนบุคคล) */
var Progress = (function () {
  var KEY = 'iupacq3', mem = null;
  function load() {
    if (mem) return mem;
    try { var t = window.localStorage.getItem(KEY); mem = t ? JSON.parse(t) : null; } catch (e) { mem = null; }
    if (!mem || mem.v !== 1) mem = { v: 1, mods: {} };
    return mem;
  }
  function save() { try { window.localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { /* ใช้ในหน่วยความจำต่อ */ } }
  return {
    shift: function (mod, k) { var m = load().mods[mod]; return m && m.shifts && m.shifts[k] || null; },
    setShift: function (mod, k, rec) {
      var d = load(); d.mods[mod] = d.mods[mod] || { shifts: {} };
      var old = d.mods[mod].shifts[k];
      if (!old || rec.stars > old.stars || (rec.stars === old.stars && rec.score > old.score)) d.mods[mod].shifts[k] = rec;
      save();
    },
    bottleDone: function (mod, id) { var m = load().mods[mod]; return !!(m && m.bottles && m.bottles[id]); },
    setBottle: function (mod, id, pts) {
      var d = load(); d.mods[mod] = d.mods[mod] || { shifts: {} }; d.mods[mod].bottles = d.mods[mod].bottles || {};
      if (!(d.mods[mod].bottles[id] >= pts)) d.mods[mod].bottles[id] = pts; save();
    },
    stars: function (mod) { var m = load().mods[mod], t = 0; if (m && m.shifts) Object.keys(m.shifts).forEach(function (k) { t += m.shifts[k].stars; }); return t; },
    reset: function () { mem = { v: 1, mods: {} }; save(); }
  };
})();

/* แบบฝึกเสริม (D12 = ข) — แบบฝึกปรนัยเดิมของ IUPAC Quest ฉบับก่อน ย้ายมาแยกจากเกม
   ไม่ใช่เกม: ไม่มีคะแนน/ดาว/ความน่าเชื่อถือ ไม่ปลดการ์ด ไม่ส่งข้อมูลเข้า Sheet · ตัวเลือกแรกในข้อมูลคือคำตอบที่ถูก (สลับตำแหน่งตอนแสดง) */
function fmtFormula(t) { var sub = '₀₁₂₃₄₅₆₇₈₉'; return String(t).replace(/([A-Za-z\)])(\d+)/g, function (m, c, n) { return c + n.split('').map(function (d) { return sub[+d]; }).join(''); }); }
function shuffled(a) { var r = a.slice(), i, j, t; for (i = r.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = r[i]; r[i] = r[j]; r[j] = t; } return r; }
function showDrillMenu(back) {
  var root = clear(App.root); window.__S = null;
  root.appendChild(h('div', { 'class': 'head' }, [h('button', { 'class': 'btn ghost', id: 'btn-back', text: '← เมนู', on: { click: function () { showHome(); } } }), h('div', { 'class': 'ttl' }, [h('b', { text: 'แบบฝึกเสริม' })])]));
  root.appendChild(h('p', { 'class': 'banner', id: 'drill-banner', text: 'แบบฝึกเสริม — ไม่ใช่เกม · ไม่นับคะแนน ไม่ให้ดาว ไม่ส่งข้อมูล · เป็นแบบฝึกปรนัยเดิมจากฉบับก่อน (ตัดข้อนอกขอบเขตออกแล้ว) ถ้าข้อใดขัดกับตำรา ให้ถือตามตำรา' }));
  ((DRILL_DATA && DRILL_DATA.sets) || []).forEach(function (s) {
    root.appendChild(h('button', { 'class': 'btn block', id: 'drill-' + s.id, text: s.title + ' (' + s.items.length + ' ข้อ)', on: { click: function () { runDrill(s); } } }));
  });
}
function runDrill(set) {
  var items = set.items.slice(), i = 0, right = 0, root = clear(App.root);
  window.__DRILL = { set: set };
  function show() {
    clear(root);
    root.appendChild(h('div', { 'class': 'head' }, [h('button', { 'class': 'btn ghost', id: 'btn-back', text: '← รายการ', on: { click: function () { showDrillMenu(); } } }), h('div', { 'class': 'ttl' }, [h('b', { text: 'แบบฝึกเสริม · ' + set.title }), h('span', { 'class': 'sub', text: 'ข้อ ' + (i + 1) + ' / ' + items.length + ' (ไม่นับคะแนน)' })])]));
    if (i >= items.length) { root.appendChild(h('div', { 'class': 'panel end' }, [h('h2', { text: 'จบชุดนี้' }), h('p', { text: 'ตอบถูก ' + right + ' จาก ' + items.length + ' ข้อ (เพื่อทบทวนเท่านั้น ไม่บันทึก)' })])); return; }
    var it = items[i], fb = h('div', { 'class': 'fb', id: 'fb' });
    root.appendChild(h('p', { 'class': 'ask', text: it.q }));
    if (it.f) root.appendChild(h('div', { 'class': 'labeltext', text: fmtFormula(it.f) }));
    shuffled(it.o.map(function (t, k) { return { t: t, ok: k === 0 }; })).forEach(function (o) {
      root.appendChild(h('button', { 'class': 'btn block opt', text: fmtFormula(o.t), on: { click: function () {
        if (fb.getAttribute('data-done')) return; fb.setAttribute('data-done', '1');
        if (o.ok) right++;
        fb.appendChild(h('div', { 'class': o.ok ? 'ok' : 'no' }, [h('b', { text: o.ok ? 'ถูก' : 'ยังไม่ถูก' }), h('p', { text: it.why })]));
        fb.appendChild(h('button', { 'class': 'btn primary', id: 'drill-next', text: i + 1 >= items.length ? 'ดูผล' : 'ข้อถัดไป →', on: { click: function () { i++; show(); } } }));
      } } }));
    });
    root.appendChild(fb);
  }
  show();
}

/* ==== 80_net.js ==== */
/* ส่งข้อมูลเชิงคุณภาพเข้า Google Sheet (D14 = ส่ง · ครู deploy Code GS/IUPAC_AppsScript.gs เอง)
   ข้อมูลที่ส่ง: เลขประจำตัว ชื่อ ห้อง (ที่ผู้เล่นกรอกเอง) · โมดูล กะ ขวด · ชื่อฉลากที่ประกอบ · ถูก/ผิด · ชนิดความผิด · จำนวนผิด/คำใบ้ — ไม่ใช่คะแนน E1
   ไม่ตั้ง URL = ไม่ส่งอะไรออกจากเครื่อง (เล่นได้ปกติ) · ส่งไม่สำเร็จ → เข้าคิว ส่งซ้ำเมื่อส่งครั้งต่อไปได้ */
var DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbwx-7-kN90IUnVJsse4WYLxuLLBc6QbtZOehivtfPZNAjxiF6c-lyq91Nx1rVMOGma6/exec';           /* ครูใส่ URL (.../exec) ที่นี่แล้ว build ใหม่ หรือให้ผู้เล่นวางใน ⚙ */
var Net = (function () {
  var KEY = 'iupacq3-net', cfg = null, queue = [], online = null, sessionStart = Date.now();
  function load() {
    if (cfg) return cfg;
    try { cfg = JSON.parse(window.localStorage.getItem(KEY) || 'null'); } catch (e) { cfg = null; }
    if (!cfg) cfg = { url: '', sid: '', name: '', room: '' };
    if (!cfg.url && DEFAULT_GAS_URL) cfg.url = DEFAULT_GAS_URL;
    return cfg;
  }
  function save() { try { window.localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) { /* ใช้ในหน่วยความจำ */ } }
  function post(kind, data) {
    var c = load(); if (!c.url) return;
    var payload = { kind: kind, version: VERSION, game: 'IUPAC_QUEST', data: data };
    try {
      window.fetch(c.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
        .then(function (r) { return r.text(); }).then(function () { online = true; flush(); })
        .catch(function () { online = false; queue.push(payload); });
    } catch (e) { online = false; queue.push(payload); }
  }
  function flush() {
    var c = load(); if (!c.url || !queue.length) return;
    var q = queue.slice(); queue = [];
    q.forEach(function (p) { try { window.fetch(c.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(p) }).catch(function () { queue.push(p); }); } catch (e) { queue.push(p); } });
  }
  function who() { var c = load(); return { sid: c.sid, name: c.name, room: c.room }; }
  return {
    config: function () { return load(); },
    set: function (o) { var c = load(); ['url', 'sid', 'name', 'room'].forEach(function (k) { if (o[k] !== undefined) c[k] = String(o[k]).trim(); }); save(); },
    enabled: function () { return !!load().url && !!load().sid; },
    online: function () { return online; },
    queued: function () { return queue.length; },
    ping: function () { post('ping', {}); },
    login: function () { var w = who(); if (w.sid) post('login', { sid: w.sid, name: w.name, room: w.room, ts: new Date().toISOString() }); },
    event: function (S, b, ok, extra) {
      var w = who(); if (!w.sid || S.practice) return;                    /* โหมดฝึกไม่ส่ง · ไม่ลงชื่อไม่ส่ง */
      post('event', { ts: new Date().toISOString(), sid: w.sid, name: w.name, room: w.room, mod: S.mod, shift: S.k + 1, bottle: b.id, compound: (b.canon && b.canon.name) || b.name || '', ok: !!ok, text: extra.text || '', errors: (extra.errors || []).join('+'), step: extra.step || '', mode: extra.mode || '', wrong: S.wrong, hints: S.hints });
    },
    shift: function (S, failed, stars) {
      var w = who(); if (!w.sid || S.practice) return;
      post('shift', { ts: new Date().toISOString(), sid: w.sid, name: w.name, room: w.room, mod: S.mod, shift: S.k + 1, score: S.score, max: S.bottles.length * 10, stars: stars, failed: !!failed, cred: S.cred, minutes: Math.round((Date.now() - sessionStart) / 60000), detail: JSON.stringify(S.results.map(function (r) { return [r.id, r.ok ? 1 : 0, r.pts, r.wrong, r.hints]; })) });
    }
  };
})();

    h('span', { text: who.sid ? 'ผู้เล่น: ' + who.name + ' · ' + who.room + ' · ' + who.sid : 'ยังไม่ได้ลงชื่อ (เล่นได้ แต่ไม่ส่งข้อมูลให้ครู)' }),
    h('button', { 'class': 'btn ghost', id: 'btn-settings', text: who.sid ? '⚙ แก้ไข' : '⚙ ลงชื่อ / ตั้งค่า', on: { click: function () { showSettings(); } } })
  ]));
  var tabs = h('div', { 'class': 'tabs' }, [['play', 'เกม'], ['cards', 'การ์ดความรู้'], ['drill', 'แบบฝึกเสริม']].map(function (t) {
    return h('button', { 'class': 'tab' + (App.tab === t[0] ? ' on' : ''), id: 'tab-' + t[0], text: t[1], on: { click: function () { App.tab = t[0]; if (t[0] === 'drill') showDrillMenu(); else showHome(); } } });
  }));
  root.appendChild(tabs);
  if (App.tab === 'cards') return showCards(root);
  var prac = h('input', { type: 'checkbox', id: 'chk-practice' });
  prac.checked = App.practice;
  prac.addEventListener('change', function () { App.practice = prac.checked; });
  root.appendChild(h('label', { 'class': 'practice' }, [prac, h('span', { text: ' โหมดฝึก (ไม่มีกะงาน ไม่เสียความน่าเชื่อถือ ไม่นับดาว ไม่ส่งข้อมูล)' })]));
  MODULES.forEach(function (mod) {
    var card = h('section', { 'class': 'mod', id: 'mod-' + mod.id }, [
      h('div', { 'class': 'mh' }, [h('b', { text: mod.id + ' ' + mod.name }), h('span', { 'class': 'sub', text: mod.sub })])
    ]);
    var n = shiftCount(mod.id), row = h('div', { 'class': 'row wrap' });
    for (var k = 0; k < n; k++) (function (k) {
      var rec = Progress.shift(mod.id, k);
      row.appendChild(h('button', { 'class': 'btn' + (rec ? ' done' : ''), id: 'start-' + mod.id + '-' + k, text: 'กะ ' + (k + 1) + (rec ? ' ' + starText(rec.stars) : ''), on: { click: function () { runShift(mod.id, k, App.practice); } } }));
    })(k);
    card.appendChild(row);
    root.appendChild(card);
  });
  root.appendChild(h('footer', {}, [
    h('p', { text: 'กติกาการเรียกชื่อตามตำรา/คู่มือครู เคมี เล่ม 5 (สสวท.) · ชื่อสารมาจากชุดข้อมูลที่ครูอนุมัติ ' + COMPOUNDS.length + ' ตัว · ฉบับ ' + VERSION }),
    h('button', { 'class': 'btn ghost', id: 'btn-reset', text: 'ล้างความก้าวหน้า', on: { click: function () { if (window.confirm('ล้างความก้าวหน้าทั้งหมด?')) { Progress.reset(); showHome(); } } } })
  ]));
}
function showCards(root) {
  root.appendChild(h('p', { 'class': 'ask', text: 'การ์ดความรู้ปลดเมื่อผ่านโมดูล (ได้ดาวอย่างน้อย 1 ใน 1 กะ) — เปิดอ่านย้อนหลังได้' }));
  CARDS.forEach(function (c) {
    var open = cardUnlocked(c);
    var box = h('section', { 'class': 'card' + (open ? '' : ' locked'), id: 'card-' + c.id }, [h('b', { text: (open ? '📖 ' : '🔒 ') + c.title }), h('span', { 'class': 'sub', text: ' · ผ่าน ' + c.mod + ' เพื่อปลด' })]);
    if (open) { var body = h('div', { 'class': 'cbody' }); body.innerHTML = c.html; body.style.display = 'none'; box.appendChild(body); box.firstChild.addEventListener('click', function () { body.style.display = body.style.display === 'none' ? 'block' : 'none'; }); box.firstChild.style.cursor = 'pointer'; }
    root.appendChild(box);
  });
  var ok = allDone(), fs = h('section', { 'class': 'card' + (ok ? '' : ' locked'), id: 'card-final' }, [h('b', { text: (ok ? '📘 ' : '🔒 ') + 'ชีตสรุปทุกโมดูล' }), h('span', { 'class': 'sub', text: ' · ผ่านครบทั้ง 7 โมดูลเพื่อปลด' })]);
  if (ok) { var fb = h('div', { 'class': 'cbody' }); fb.innerHTML = FINAL_SHEET; fb.style.display = 'none'; fs.appendChild(fb); fs.firstChild.addEventListener('click', function () { fb.style.display = fb.style.display === 'none' ? 'block' : 'none'; }); fs.firstChild.style.cursor = 'pointer'; }
  root.appendChild(fs);
}
function showSettings() {
  var root = clear(App.root), c = Net.config();
  function inp(id, label, val, ph) { return h('label', { 'class': 'fld' }, [h('span', { text: label }), h('input', { id: id, value: val || '', placeholder: ph || '', autocomplete: 'off' })]); }
  root.appendChild(h('div', { 'class': 'head' }, [h('button', { 'class': 'btn ghost', id: 'btn-back', text: '← เมนู', on: { click: function () { showHome(); } } }), h('div', { 'class': 'ttl' }, [h('b', { text: 'ลงชื่อ / ตั้งค่า' })])]));
  root.appendChild(h('p', { 'class': 'note', text: 'ข้อมูลที่ส่งให้ครู (เมื่อครูตั้ง URL): เลขประจำตัว ชื่อ ห้อง · ว่าเล่นโมดูล/ขวดใด ประกอบฉลากว่าอะไร ถูกหรือผิด ผิดแบบใด ใช้คำใบ้กี่ครั้ง — ใช้เป็นข้อมูลเชิงคุณภาพ ไม่ใช่คะแนนสอบ · โหมดฝึกไม่ส่ง' }));
  root.appendChild(inp('in-sid', 'เลขประจำตัว', c.sid)); root.appendChild(inp('in-name', 'ชื่อ-สกุล', c.name)); root.appendChild(inp('in-room', 'ห้อง', c.room));
  root.appendChild(inp('in-url', 'URL ของ Google Apps Script (ครูให้มา · ลงท้าย /exec)', c.url, 'https://script.google.com/macros/s/…/exec'));
  var st = h('p', { 'class': 'note', id: 'net-status', text: 'สถานะ: ' + (c.url ? 'ตั้งค่า URL แล้ว' : 'ยังไม่ได้ตั้ง URL — ไม่ส่งข้อมูล') });
  root.appendChild(st);
  root.appendChild(h('div', { 'class': 'row' }, [h('button', { 'class': 'btn primary', id: 'btn-save', text: 'บันทึก', on: { click: function () {
    Net.set({ sid: document.getElementById('in-sid').value, name: document.getElementById('in-name').value, room: document.getElementById('in-room').value, url: document.getElementById('in-url').value });
    Net.login(); Net.ping(); showHome();
  } } })]));
}
function boot() {
  App.root = document.getElementById('app');
  showHome();
}
if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
}

</script>
</body>
</html>
